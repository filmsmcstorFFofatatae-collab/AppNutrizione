<!doctype html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#101211" />
  <title>Nutri / Cycle</title>
  <style>
    :root { --bg:#101211; --surface:#1b1e1c; --surface-2:#242825; --line:#363b37; --text:#f5f6f4; --muted:#a6aaa6; --accent:#79e0c5; --ink:#101211; --white:#ecefec; }
    * { box-sizing:border-box } html { scroll-behavior:smooth } body { margin:0; background:var(--bg); color:var(--text); font:15px/1.45 Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; }
    button,input,select,textarea { font:inherit } button { cursor:pointer } .shell { max-width:1320px; margin:auto; padding:0 22px 52px }
    .topbar { position:sticky; top:0; z-index:20; background:rgba(16,18,17,.94); backdrop-filter:blur(16px); border-bottom:1px solid var(--line); margin-bottom:28px; }
    .top-inner { max-width:1320px; margin:auto; padding:14px 22px 16px; display:grid; grid-template-columns:minmax(0,1fr) auto; gap:20px; align-items:center; }
    .macro-strip { display:grid; grid-template-columns:repeat(4,minmax(100px,1fr)); gap:13px }.macro { min-width:0 }.macro-head { display:block; color:var(--muted); font-size:11px; text-transform:uppercase; letter-spacing:.08em; margin-bottom:6px }.macro-value { display:block; color:var(--text); font-size:12px; letter-spacing:0; text-transform:none; white-space:nowrap; margin-top:2px }.track { background:#343a35; height:5px; overflow:hidden; border-radius:9px }.fill { height:100%; background:var(--white); width:0; border-radius:9px; transition:width .35s ease }
    .action, .ghost, .small-btn, .serving-option { border:1px solid var(--line); color:var(--text); background:transparent; border-radius:8px; padding:10px 13px; font-weight:700; transition:.2s }.action { background:var(--accent); border-color:var(--accent); color:var(--ink); white-space:nowrap }.action:hover { filter:brightness(1.08) }.ghost:hover,.small-btn:hover,.serving-option:hover { border-color:var(--accent); color:var(--accent) }
    .header-actions { display:flex; gap:8px; align-items:center }.micro-toggle { white-space:nowrap }
    .micro-drawer { display:none; background:var(--surface); border:1px solid var(--line); padding:22px; border-radius:12px; margin:-10px 0 28px }.micro-drawer.open { display:block; animation:reveal .25s ease }.drawer-header { display:flex; justify-content:space-between; gap:18px; align-items:center; padding-bottom:18px; border-bottom:1px solid var(--line); margin-bottom:20px }.drawer-header h2 { margin:0; font-size:18px }.drawer-header p { margin:4px 0 0; color:var(--muted); font-size:13px }.micro-grid { display:grid; grid-template-columns:repeat(4,minmax(180px,1fr)); gap:22px }.micro-group h3 { font-size:12px; text-transform:uppercase; letter-spacing:.08em; color:var(--muted); margin:0 0 13px }.micro-row { margin:0 0 12px }.micro-label { font-size:12px; display:flex; justify-content:space-between; gap:7px; margin-bottom:5px }.micro-label span:last-child { color:var(--muted); white-space:nowrap }.micro-fill { background:var(--accent) }
    .recipe-grid { display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:17px }.recipe { background:var(--surface); border:1px solid var(--line); border-radius:12px; overflow:hidden; display:flex; flex-direction:column }.recipe-image { height:180px; object-fit:cover; width:100%; display:block; background:var(--surface-2) }.recipe-main { padding:17px; display:flex; flex-direction:column; height:100% }.recipe-meta { color:var(--accent); text-transform:uppercase; letter-spacing:.08em; font-size:10px; font-weight:800 }.recipe h3 { font-size:21px; letter-spacing:-.035em; line-height:1.1; margin:7px 0 13px }.storage { background:var(--surface-2); border-left:2px solid var(--accent); color:var(--muted); padding:9px 11px; font-size:12px; margin:0 0 15px }.nutrition { display:grid; grid-template-columns:repeat(5,1fr); gap:4px; margin:0 0 15px; padding:10px 0; border-top:1px solid var(--line); border-bottom:1px solid var(--line) }.nutrition div { min-width:0 }.nutrition b { display:block; color:var(--muted); font-size:9px; text-transform:uppercase; letter-spacing:.06em; font-weight:700 }.nutrition span { font-size:12px; font-weight:800; white-space:nowrap }.field-label { color:var(--muted); font-size:11px; font-weight:700; letter-spacing:.07em; text-transform:uppercase; display:block; margin-bottom:6px }.portion-choices { display:flex; gap:5px; flex-wrap:wrap; align-items:center; margin-bottom:15px }.serving-option { font-size:12px; padding:6px 10px }.serving-option.selected { background:var(--white); color:var(--ink); border-color:var(--white) }.custom-multiplier { width:88px; padding:6px 8px; font-size:12px; margin-left:2px }.ingredients { border-top:1px solid var(--line); padding-top:12px; margin:0 0 12px; color:var(--muted); font-size:13px; min-height:118px }.ingredients ul { margin:5px 0 0; padding:0; list-style:none }.ingredients li { display:flex; justify-content:space-between; gap:8px; padding:3px 0 }.ingredients li span:last-child { color:var(--text); white-space:nowrap }.recipe details { border-top:1px solid var(--line); margin:0 0 15px; padding-top:11px }.recipe summary { color:var(--text); cursor:pointer; font-weight:700; font-size:13px }.recipe ol { color:var(--muted); font-size:13px; padding-left:18px; margin:9px 0 0 }.log-row { display:grid; grid-template-columns:1fr auto; gap:8px; margin-top:auto }.number-input, .text-input, textarea, select { width:100%; color:var(--text); border:1px solid var(--line); background:#141715; border-radius:8px; padding:10px 11px; outline:none }.number-input:focus,.text-input:focus,textarea:focus,select:focus { border-color:var(--accent) }.number-input { max-width:104px }
    dialog { width:min(860px,calc(100% - 28px)); max-height:calc(100vh - 34px); padding:0; border:1px solid var(--line); background:var(--surface); color:var(--text); border-radius:13px; overflow:hidden; box-shadow:0 24px 100px #000a } dialog::backdrop { background:#000b; backdrop-filter:blur(4px) }.modal-head { display:flex; justify-content:space-between; align-items:center; padding:20px 22px; border-bottom:1px solid var(--line); position:sticky; top:0; background:var(--surface); z-index:1 }.modal-head h2 { margin:0; font-size:21px }.icon-btn { width:34px; height:34px; border:0; color:var(--text); background:transparent; font-size:23px }.recipe-form { padding:22px; overflow:auto; max-height:calc(100vh - 110px) }.form-grid { display:grid; grid-template-columns:repeat(3,1fr); gap:13px; margin-bottom:15px }.form-grid .wide { grid-column:span 3 }.form-section { border-top:1px solid var(--line); padding-top:18px; margin-top:18px }.form-section h3 { font-size:14px; margin:0 0 13px }.ingredient-editor,.step-editor { display:grid; grid-template-columns:1fr 90px 75px auto; gap:8px; margin-bottom:8px }.step-editor { grid-template-columns:1fr auto }.remove { background:none; border:0; color:var(--muted); font-size:18px }.add-row { color:var(--accent); background:none; border:0; font-weight:700; padding:6px 0 }.nutrient-grid { display:grid; grid-template-columns:repeat(4,1fr); gap:10px }.nutrient-grid label { font-size:11px; color:var(--muted) }.nutrient-grid input { margin-top:4px }.form-actions { display:flex; justify-content:space-between; gap:10px; align-items:center; border-top:1px solid var(--line); padding-top:20px; margin-top:21px }.form-actions div { display:flex; gap:8px }
    .toast { position:fixed; z-index:30; bottom:24px; left:50%; transform:translate(-50%,20px); opacity:0; background:var(--white); color:var(--ink); padding:11px 15px; border-radius:8px; font-weight:800; transition:.25s; pointer-events:none }.toast.show { opacity:1; transform:translate(-50%,0) }.empty { grid-column:1/-1; color:var(--muted); padding:32px 0 }.loading { color:var(--muted); padding:40px 0 }
    @keyframes reveal { from { opacity:0; transform:translateY(-7px) } to { opacity:1; transform:none } }
    @media(max-width:1000px) { .top-inner { grid-template-columns:1fr auto }.macro-strip { grid-row:2; grid-column:1/-1 }.recipe-grid { grid-template-columns:repeat(2,minmax(0,1fr)) }.micro-grid { grid-template-columns:repeat(2,1fr) } }
    @media(max-width:620px) { .shell { padding:0 14px 38px }.top-inner { padding:12px 14px 14px; gap:10px }.header-actions .micro-toggle { font-size:0; padding:10px }.header-actions .micro-toggle::after { content:'Micro'; font-size:12px }.action { padding:10px }.macro-strip { display:grid; grid-template-columns:1fr; gap:9px; overflow:visible }.macro-head { display:flex; justify-content:space-between; align-items:baseline; gap:12px }.macro-value { margin-top:0 }.recipe-grid { grid-template-columns:1fr }.recipe-image { height:165px }.recipe-main { padding:14px }.micro-grid { grid-template-columns:1fr }.drawer-header { display:block }.drawer-header .action { margin-top:13px; width:100% }.form-grid,.nutrient-grid { grid-template-columns:1fr 1fr }.form-grid .wide { grid-column:span 2 }.ingredient-editor { grid-template-columns:1fr 70px 58px auto }.form-actions { display:block }.form-actions div { margin-top:10px }.form-actions .action { width:100% } }
  </style>
</head>
<body>
  <header class="topbar"><div class="top-inner">
    <div class="macro-strip" id="macroStrip"></div>
    <div class="header-actions"><button class="ghost micro-toggle" id="microToggle">Micronutrienti ▼</button><button class="action" id="newRecipe">+ Nuova Ricetta</button></div>
  </div></header>
  <main class="shell">
    <section class="micro-drawer" id="microDrawer"><div class="drawer-header"><div><h2>Micronutrienti</h2><p id="cycleInfo"></p></div><button class="action" id="resetMicro">Azzera Periodo Micro (Nuovo Ciclo)</button></div><div class="micro-grid" id="microGrid"></div></section>
    <section class="recipe-grid" id="recipeGrid"><p class="loading">Caricamento ricette…</p></section>
  </main>
  <dialog id="recipeDialog"><div class="modal-head"><h2>Nuova ricetta</h2><button class="icon-btn" id="closeDialog" aria-label="Chiudi">×</button></div><form class="recipe-form" id="recipeForm">
    <div class="form-grid"><label class="wide"><span class="field-label">Titolo</span><input required name="title" class="text-input" placeholder="Es. Bowl di quinoa" /></label><label><span class="field-label">Categoria</span><input required name="category" class="text-input" placeholder="Es. Vegetariana" /></label><label><span class="field-label">Tempo (min)</span><input required min="1" name="prep_time_min" type="number" class="text-input" /></label><label><span class="field-label">URL immagine</span><input name="image_url" type="url" class="text-input" placeholder="https://… (facoltativo)" /></label><label class="wide"><span class="field-label">Conservazione</span><textarea required name="storage_notes" rows="2" placeholder="Es. 3 giorni in frigo, contenitore ermetico."></textarea></label></div>
    <section class="form-section"><h3>Ingredienti · porzione singola</h3><div id="ingredientInputs"></div><button type="button" class="add-row" id="addIngredient">+ Aggiungi ingrediente</button></section>
    <section class="form-section"><h3>Preparazione</h3><div id="stepInputs"></div><button type="button" class="add-row" id="addStep">+ Aggiungi passaggio</button></section>
    <section class="form-section"><h3>Macro e calorie · porzione singola</h3><div class="nutrient-grid" id="macroInputs"></div></section>
    <section class="form-section"><h3>Micronutrienti · porzione singola</h3><div class="nutrient-grid" id="microInputs"></div></section>
    <div class="form-actions"><button type="button" class="ghost" id="exportRecipes">Esporta recipes.json</button><div><button type="button" class="ghost" id="cancelDialog">Annulla</button><button class="action" type="submit">Salva ricetta</button></div></div>
  </form></dialog><div class="toast" id="toast"></div>
  <script>
    const MICRO_GROUPS = [
      ['Minerali Maggiori',['calcium_mg','magnesium_mg','potassium_mg','sodium_mg','phosphorus_mg']],
      ['Oligoelementi',['iron_mg','zinc_mg','copper_mg','manganese_mg','selenium_ug','iodine_ug']],
      ['Vitamine Idrosolubili',['vit_c_mg','vit_b1_mg','vit_b2_mg','vit_b3_mg','vit_b5_mg','vit_b6_mg','vit_b9_ug','vit_b12_ug']],
      ['Vitamine Liposolubili',['vit_a_ug','vit_d_ui','vit_e_mg','vit_k_ug']]
    ];
    const LABELS = { calories:'Calorie',protein_g:'Proteine',carbs_g:'Carboidrati',fat_g:'Grassi',fiber_g:'Fibre',calcium_mg:'Calcio',magnesium_mg:'Magnesio',potassium_mg:'Potassio',sodium_mg:'Sodio',phosphorus_mg:'Fosforo',iron_mg:'Ferro',zinc_mg:'Zinco',copper_mg:'Rame',manganese_mg:'Manganese',selenium_ug:'Selenio',iodine_ug:'Iodio',vit_c_mg:'Vitamina C',vit_b1_mg:'Vitamina B1',vit_b2_mg:'Vitamina B2',vit_b3_mg:'Vitamina B3',vit_b5_mg:'Vitamina B5',vit_b6_mg:'Vitamina B6',vit_b9_ug:'Vitamina B9',vit_b12_ug:'Vitamina B12',vit_a_ug:'Vitamina A',vit_d_ui:'Vitamina D',vit_e_mg:'Vitamina E',vit_k_ug:'Vitamina K' };
    const UNITS = { calories:'kcal',protein_g:'g',carbs_g:'g',fat_g:'g',fiber_g:'g',calcium_mg:'mg',magnesium_mg:'mg',potassium_mg:'mg',sodium_mg:'mg',phosphorus_mg:'mg',iron_mg:'mg',zinc_mg:'mg',copper_mg:'mg',manganese_mg:'mg',selenium_ug:'µg',iodine_ug:'µg',vit_c_mg:'mg',vit_b1_mg:'mg',vit_b2_mg:'mg',vit_b3_mg:'mg',vit_b5_mg:'mg',vit_b6_mg:'mg',vit_b9_ug:'µg',vit_b12_ug:'µg',vit_a_ug:'µg',vit_d_ui:'UI',vit_e_mg:'mg',vit_k_ug:'µg' };
    let config, staticRecipes = [], recipes = [], mealLogs = [], portions = {};
    const $ = s => document.querySelector(s); const escapeHtml = v => String(v ?? '').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));
    function format(n){ return new Intl.NumberFormat('it-IT',{maximumFractionDigits:1}).format(n||0) }
    function nutritionDay(timestamp = new Date()) { const d = new Date(timestamp); if (d.getHours() < 7) d.setDate(d.getDate()-1); return d.toISOString().slice(0,10) }
    function activeDayLogs(){ const today=nutritionDay(); return mealLogs.filter(log=>nutritionDay(log.timestamp)===today) }
    function recipeFor(id){ return recipes.find(r=>r.id===id) }
    function sumNutrition(logs, source){ const total={ calories:0, macros:{protein_g:0,carbs_g:0,fat_g:0,fiber_g:0}, micros:{} }; Object.keys(config.micro_cycle_settings.daily_rda).forEach(k=>total.micros[k]=0); logs.forEach(log=>{ const r=recipeFor(log.recipe_id); if(!r)return; const n=r.nutrition_single_serving; const s=Number(log.servings)||0; total.calories+=n.calories*s; Object.keys(total.macros).forEach(k=>total.macros[k]+=(n.macros[k]||0)*s); Object.keys(total.micros).forEach(k=>total.micros[k]+=(n.micros[k]||0)*s) }); return total }
    function renderMacros(){ const n=sumNutrition(activeDayLogs()); const targets=config.macro_daily_targets; const entries=[['calories',n.calories],['protein_g',n.macros.protein_g],['carbs_g',n.macros.carbs_g],['fat_g',n.macros.fat_g]]; $('#macroStrip').innerHTML=entries.map(([k,v])=>`<div class="macro"><div class="macro-head"><span>${LABELS[k]}</span><span class="macro-value">${format(v)}${UNITS[k]} / ${targets[k]}${UNITS[k]}</span></div><div class="track"><div class="fill" style="width:${Math.min(100,v/targets[k]*100)}%"></div></div></div>`).join(''); }
    function renderMicros(){ const start=new Date(localStorage.getItem('micro_cycle_start')); const cycle=config.micro_cycle_settings; const now=new Date(); const days=Math.max(1,Math.floor((now-start)/86400000)+1); $('#cycleInfo').textContent=`Giorno ${Math.min(days,cycle.cycle_days)} di ${cycle.cycle_days} · iniziato ${start.toLocaleDateString('it-IT')}`; const n=sumNutrition(mealLogs.filter(l=>new Date(l.timestamp)>=start)); $('#microGrid').innerHTML=MICRO_GROUPS.map(([title,keys])=>`<div class="micro-group"><h3>${title}</h3>${keys.map(k=>{const val=n.micros[k]||0,target=cycle.daily_rda[k]*cycle.cycle_days,pct=Math.round(val/target*100);return `<div class="micro-row"><div class="micro-label"><span>${LABELS[k]}</span><span>${format(val)} / ${format(target)} ${UNITS[k]} · ${pct}%</span></div><div class="track"><div class="fill micro-fill" style="width:${Math.min(100,pct)}%"></div></div></div>`}).join('')}</div>`).join(''); }
    function fallbackImage(title){ return `https://images.unsplash.com/photo-1547592180-85f173990554?auto=format&fit=crop&w=900&q=80` }
    function renderRecipes(){ $('#recipeGrid').innerHTML=recipes.length?recipes.map(r=>{ const m=portions[r.id]||1, n=r.nutrition_single_serving; return `<article class="recipe" data-recipe-id="${escapeHtml(r.id)}"><img class="recipe-image" src="${escapeHtml(r.image_url||fallbackImage(r.title))}" alt="${escapeHtml(r.title)}" onerror="this.src='${fallbackImage(r.title)}'"><div class="recipe-main"><div class="recipe-meta">${r.prep_time_min} min</div><h3>${escapeHtml(r.title)}</h3><div class="nutrition" aria-label="Valori nutrizionali per porzione"><div><b>Kcal</b><span>${format(n.calories)}</span></div><div><b>Proteine</b><span>${format(n.macros.protein_g)}g</span></div><div><b>Carbo</b><span>${format(n.macros.carbs_g)}g</span></div><div><b>Grassi</b><span>${format(n.macros.fat_g)}g</span></div><div><b>Fibre</b><span>${format(n.macros.fiber_g)}g</span></div></div><p class="storage"><b>Conservazione:</b> ${escapeHtml(r.storage_notes)}</p><span class="field-label">Meal prep personalizzato</span><div class="portion-choices">${[1,2,3,4].map(p=>`<button class="serving-option ${m===p?'selected':''}" data-portion="${p}" data-id="${r.id}" type="button">${p}×</button>`).join('')}<input class="number-input custom-multiplier" aria-label="Moltiplicatore personalizzato" data-custom-portion="${r.id}" type="number" min="0.5" step="0.5" value="${m}" title="Moltiplicatore personalizzato"></div><div class="ingredients"><span class="field-label" data-serving-label>Ingredienti · ${m} ${m===1?'porzione':'porzioni'}</span><ul>${r.ingredients_single_serving.map(i=>`<li><span>${escapeHtml(i.name)}</span><span data-amount="${i.amount}" data-unit="${escapeHtml(i.unit)}">${format(i.amount*m)} ${escapeHtml(i.unit)}</span></li>`).join('')}</ul></div><details><summary>Preparazione</summary><ol>${r.preparation_steps.map(s=>`<li>${escapeHtml(s)}</li>`).join('')}</ol></details><div class="log-row"><input class="number-input" aria-label="Porzioni consumate" type="number" data-log-input="${r.id}" min="0.1" step="0.5" value="1"><button class="action" type="button" data-log="${r.id}">+ Registra Pasto</button></div></div></article>`}).join(''):'<p class="empty">Nessuna ricetta disponibile.</p>'; }
    function updateRecipePortion(id, value){ const multiplier=Number(value); if(!multiplier || multiplier<0.1)return; portions[id]=multiplier; const card=document.querySelector(`.recipe[data-recipe-id="${CSS.escape(id)}"]`); if(!card)return; card.querySelector('[data-serving-label]').textContent=`Ingredienti · ${format(multiplier)} ${multiplier===1?'porzione':'porzioni'}`; card.querySelectorAll('[data-amount]').forEach(item=>item.textContent=`${format(Number(item.dataset.amount)*multiplier)} ${item.dataset.unit}`); card.querySelectorAll('[data-portion]').forEach(button=>button.classList.toggle('selected',Number(button.dataset.portion)===multiplier)); }
    function renderAll(){ renderMacros(); renderMicros(); renderRecipes() }
    function toast(message){ const t=$('#toast');t.textContent=message;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2400) }
    function saveLogs(){ localStorage.setItem('meal_logs',JSON.stringify(mealLogs)) }
    function logMeal(id){ const input=document.querySelector(`[data-log-input="${CSS.escape(id)}"]`); const servings=Number(input.value); if(!servings||servings<=0)return toast('Inserisci una porzione valida'); mealLogs.push({id:crypto.randomUUID?crypto.randomUUID():String(Date.now()),recipe_id:id,servings,timestamp:new Date().toISOString()}); saveLogs(); renderMacros();renderMicros();toast('Pasto registrato') }
    function addIngredient(values={}){ const row=document.createElement('div');row.className='ingredient-editor';row.innerHTML=`<input required class="text-input ing-name" value="${escapeHtml(values.name||'')}" placeholder="Ingrediente"><input required class="text-input ing-amount" type="number" min="0" step="0.1" value="${values.amount??''}" placeholder="Qtà"><input required class="text-input ing-unit" value="${escapeHtml(values.unit||'g')}" placeholder="g"><button class="remove" type="button" aria-label="Rimuovi">×</button>`;row.querySelector('.remove').onclick=()=>row.remove();$('#ingredientInputs').append(row) }
    function addStep(value=''){ const row=document.createElement('div');row.className='step-editor';row.innerHTML=`<input required class="text-input step-value" value="${escapeHtml(value)}" placeholder="Descrivi il passaggio"><button class="remove" type="button" aria-label="Rimuovi">×</button>`;row.querySelector('.remove').onclick=()=>row.remove();$('#stepInputs').append(row) }
    function inputField(key, required=false){return `<label>${LABELS[key]} (${UNITS[key]})<input class="text-input nutrient-input" data-key="${key}" type="number" step="any" min="0" ${required?'required':''} value="0"></label>`}
    function setupForm(){ $('#macroInputs').innerHTML=['calories','protein_g','carbs_g','fat_g','fiber_g'].map(k=>inputField(k,k!=='fiber_g')).join(''); $('#microInputs').innerHTML=Object.keys(config.micro_cycle_settings.daily_rda).map(k=>inputField(k)).join(''); addIngredient();addStep() }
    function resetForm(){ $('#recipeForm').reset();$('#ingredientInputs').innerHTML='';$('#stepInputs').innerHTML=''; addIngredient();addStep();document.querySelectorAll('.nutrient-input').forEach(x=>x.value=0) }
    function saveRecipe(event){ event.preventDefault(); const form=new FormData(event.currentTarget); const ingredients=[...document.querySelectorAll('.ingredient-editor')].map(row=>({name:row.querySelector('.ing-name').value.trim(),amount:Number(row.querySelector('.ing-amount').value),unit:row.querySelector('.ing-unit').value.trim()})); const steps=[...document.querySelectorAll('.step-value')].map(i=>i.value.trim()).filter(Boolean); if(!ingredients.length||!steps.length)return toast('Aggiungi almeno un ingrediente e un passaggio');const raw=Object.fromEntries([...document.querySelectorAll('.nutrient-input')].map(i=>[i.dataset.key,Number(i.value)||0])); const recipe={id:`custom-${Date.now()}`,title:form.get('title').trim(),category:form.get('category').trim(),image_url:form.get('image_url').trim(),prep_time_min:Number(form.get('prep_time_min')),storage_notes:form.get('storage_notes').trim(),preparation_steps:steps,ingredients_single_serving:ingredients,nutrition_single_serving:{calories:raw.calories,macros:{protein_g:raw.protein_g,carbs_g:raw.carbs_g,fat_g:raw.fat_g,fiber_g:raw.fiber_g},micros:Object.fromEntries(Object.keys(config.micro_cycle_settings.daily_rda).map(k=>[k,raw[k]]))}}; const customs=JSON.parse(localStorage.getItem('custom_recipes')||'[]'); customs.push(recipe);localStorage.setItem('custom_recipes',JSON.stringify(customs));recipes=[...staticRecipes,...customs];$('#recipeDialog').close();resetForm();renderRecipes();toast('Ricetta salvata nel catalogo') }
    function exportRecipes(){ const blob=new Blob([JSON.stringify(recipes,null,2)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='recipes.json';a.click();URL.revokeObjectURL(a.href);toast('Download di recipes.json avviato') }
    async function init(){ try { const [configRes,recipeRes]=await Promise.all([fetch('public/config.json'),fetch('public/recipes.json')]); if(!configRes.ok||!recipeRes.ok)throw Error('file di dati non trovato'); config=await configRes.json();staticRecipes=await recipeRes.json(); const customs=JSON.parse(localStorage.getItem('custom_recipes')||'[]');recipes=[...staticRecipes,...customs];mealLogs=JSON.parse(localStorage.getItem('meal_logs')||'[]'); if(!localStorage.getItem('micro_cycle_start'))localStorage.setItem('micro_cycle_start',new Date().toISOString()); setupForm();renderAll(); }catch(err){ $('#recipeGrid').innerHTML=`<p class="empty">Impossibile caricare i dati. Pubblica anche la cartella <code>public</code> insieme a index.html.</p>`;console.error(err) } }
    $('#microToggle').onclick=()=>{const drawer=$('#microDrawer');drawer.classList.toggle('open');$('#microToggle').textContent=drawer.classList.contains('open')?'Micronutrienti ▲':'Micronutrienti ▼'}; $('#resetMicro').onclick=()=>{localStorage.setItem('micro_cycle_start',new Date().toISOString());renderMicros();toast('Nuovo ciclo micronutrienti avviato')};$('#newRecipe').onclick=()=>$('#recipeDialog').showModal();$('#closeDialog').onclick=$('#cancelDialog').onclick=()=>$('#recipeDialog').close();$('#addIngredient').onclick=()=>addIngredient();$('#addStep').onclick=()=>addStep();$('#recipeForm').addEventListener('submit',saveRecipe);$('#exportRecipes').onclick=exportRecipes;
    $('#recipeGrid').addEventListener('click',e=>{ const portion=e.target.closest('[data-portion]');if(portion){portions[portion.dataset.id]=Number(portion.dataset.portion);renderRecipes()} const log=e.target.closest('[data-log]');if(log)logMeal(log.dataset.log) }); $('#recipeGrid').addEventListener('input',e=>{const custom=e.target.closest('[data-custom-portion]');if(custom)updateRecipePortion(custom.dataset.customPortion,custom.value)}); setInterval(()=>{if(config)renderMacros()},60000);init();
  </script>
